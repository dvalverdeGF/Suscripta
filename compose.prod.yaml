---
# Production environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      # OAuth2 de correo (D-93). Vacías a propósito: sin ellas la aplicación
      # arranca igual, solo que sin los botones de Google y Microsoft. Se
      # declaran aquí porque el `.env` que se hornea en la imagen es el del
      # repositorio, y los secretos reales viven en el `.env` del servidor.
      MAIL_OAUTH_GOOGLE_CLIENT_ID: ${MAIL_OAUTH_GOOGLE_CLIENT_ID:-}
      MAIL_OAUTH_GOOGLE_CLIENT_SECRET: ${MAIL_OAUTH_GOOGLE_CLIENT_SECRET:-}
      MAIL_OAUTH_MICROSOFT_CLIENT_ID: ${MAIL_OAUTH_MICROSOFT_CLIENT_ID:-}
      MAIL_OAUTH_MICROSOFT_CLIENT_SECRET: ${MAIL_OAUTH_MICROSOFT_CLIENT_SECRET:-}
      MAIL_OAUTH_MICROSOFT_TENANT: ${MAIL_OAUTH_MICROSOFT_TENANT:-consumers}

  # Consumidor de la cola asíncrona (Messenger). Ver ARCHITECTURE.md §6.
  worker:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: .
      target: frankenphp_prod
    restart: unless-stopped
    # El worker no sirve HTTP: la sonda de Caddy del Dockerfile no aplica.
    # Se comprueba que el proceso consumidor sigue vivo leyendo /proc/1.
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(str_contains(file_get_contents(\"/proc/1/cmdline\"), \"messenger:consume\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["php", "bin/console", "messenger:consume", "mail_sync", "mail_processing", "ocr", "ai", "notifications", "webhooks", "async", "--time-limit=3600", "--memory-limit=256M"]
    environment:
      APP_SECRET: ${APP_SECRET}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      # El worker también renueva los tokens OAuth2 al sincronizar, así que
      # necesita el mismo par de credenciales que el servicio web (D-93).
      MAIL_OAUTH_GOOGLE_CLIENT_ID: ${MAIL_OAUTH_GOOGLE_CLIENT_ID:-}
      MAIL_OAUTH_GOOGLE_CLIENT_SECRET: ${MAIL_OAUTH_GOOGLE_CLIENT_SECRET:-}
      MAIL_OAUTH_MICROSOFT_CLIENT_ID: ${MAIL_OAUTH_MICROSOFT_CLIENT_ID:-}
      MAIL_OAUTH_MICROSOFT_CLIENT_SECRET: ${MAIL_OAUTH_MICROSOFT_CLIENT_SECRET:-}
      MAIL_OAUTH_MICROSOFT_TENANT: ${MAIL_OAUTH_MICROSOFT_TENANT:-consumers}
    depends_on:
      database:
        condition: service_healthy
