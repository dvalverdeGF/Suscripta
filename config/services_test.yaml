# Servicios exclusivos del entorno de test.
#
# El cliente IMAP real abre conexiones de red: en los tests funcionales se
# sustituye por un doble controlable (`tests/Support/Imap/RecordingImapClient`).
# Se declara `public: true` a propósito, porque un servicio privado que solo
# consume un único servicio acabaría *inlineado* y el test obtendría una
# instancia distinta de la que recibe la aplicación.
services:
    App\Tests\Support\Imap\RecordingImapClient:
        public: true

    App\Mailbox\Application\Imap\ImapClientInterface: '@App\Tests\Support\Imap\RecordingImapClient'

    # El DNS tampoco se puede guionizar: el mismo nombre resuelve distinto en
    # cada máquina (o no resuelve si no hay red). La guarda anti-SSRF se prueba
    # con un resolutor que devuelve lo que el test le dice.
    App\Tests\Support\Webhooks\ControllableHostResolver:
        public: true

    App\Webhooks\Application\Port\HostResolverInterface: '@App\Tests\Support\Webhooks\ControllableHostResolver'

    # Los documentos se escriben en la caché del kernel y no en `var/storage`:
    # así una tanda de tests no deja binarios de prueba en el almacenamiento
    # real, que es justo lo que la retención (SECURITY.md §6) tendría que
    # limpiar después.
    App\Documents\Infrastructure\Storage\LocalDocumentStorage:
        arguments:
            $directory: '%kernel.cache_dir%/storage'

    # El reloj del sistema es un servicio **privado** del framework, así que un
    # test funcional no podría sustituirlo por un `MockClock` y acabaría
    # midiendo contra el reloj real: en cuanto pasan unos días, los tests que
    # dependien de "ahora" (alertas de cobro, ventanas de 30 y 60 días) empiezan
    # a fallar sin que haya cambiado nada del código.
    #
    # Este alias público es el punto de sustitución. Los tests lo reasignan con
    # `self::getContainer()->set('test.clock', new MockClock(...))` y el
    # código de negocio no se entera: sigue leyendo "ahora" del `Clock`.
    test.clock:
        alias: clock
        public: true

    # La pasarela de pago no se puede llamar de verdad en una tanda de tests:
    # abriría sesiones de cobro reales en una cuenta real. Este doble implementa
    # el mismo puerto, así que el checkout, el webhook y la conciliación se
    # ejecutan como en producción y el test solo cambia lo que la pasarela
    # «sabe» (Fase 24).
    App\Tests\Support\Billing\FakeStripeGateway:
        public: true

    App\Billing\Domain\Port\PaymentGatewayInterface: '@App\Tests\Support\Billing\FakeStripeGateway'
