# Pesos del filtro determinista del pipeline de correo (ARCHITECTURE.md §13.4).
#
# Estos valores son una decisión de producto, no de programa: ajustarlos cambia
# cuántos correos llegan a analizarse y, por tanto, cuánto cuesta el sistema.
# Por eso viven aquí y no enterrados en el código.
#
# Cualquier cambio debe actualizar la tabla de §13.4 de ARCHITECTURE.md.
parameters:
    app.processing.billing_score:
        # Umbral a partir del cual un mensaje se considera candidato y se
        # descarga su cuerpo. Bajarlo aumenta la cobertura y el coste.
        threshold: 40

        subject_keyword: 25
        known_provider: 20
        pdf_attachment: 15
        detectable_amount: 15
        renewal_language: 10
        billing_local_part: 10
        invoice_attachment_name: 10

        # Señales negativas. `ignored_sender` es deliberadamente mayor en valor
        # absoluto que la suma de todas las positivas: un remitente en la lista
        # de ignorados nunca debe colarse.
        ignored_sender: -100
        newsletter: -30
        own_thread: -10

        # Palabras clave del asunto. Se comparan en minúsculas y sin acentos
        # normalizados por el propio calculador.
        subject_keywords:
            - invoice
            - factura
            - receipt
            - recibo
            - payment
            - pago
            - subscription
            - suscripción
            - suscripcion
            - renewal
            - renovación
            - renovacion
            - billing
            - statement
            - charge
            - cobro
            - cuota
            - abono
            - pedido
            - order confirmation

        renewal_keywords:
            - renew
            - renewal
            - renovación
            - renovacion
            - expira
            - expires
            - vencimiento
            - next charge
            - próximo cobro
            - proximo cobro
            - will be charged
            - se renovará
            - se renovara
            - auto-renew
            - next payment
            - fecha de vencimiento

        # Partes locales del remitente que indican facturación.
        billing_local_parts:
            - invoice
            - invoices
            - factura
            - facturas
            - facturacion
            - facturación
            - billing
            - billing-notice
            - payments
            - pagos
            - receipts
            - recibos
            - no-reply-invoice
            - noreply-invoice

        # Nombres de adjunto que indican factura.
        invoice_attachment_patterns:
            - factura
            - invoice
            - recibo
            - receipt
            - fra-
            - inv-
            - billing
            - statement

        # Remitentes que nunca son facturas. Admite tres formas:
        #   facturas@proveedor.com  → dirección exacta
        #   @proveedor.com          → cualquier dirección de ese dominio
        #   proveedor.com           → el dominio del remitente
        # La comparación de dominios es por etiquetas completas, así que
        # `linkedin.com` no descarta el correo de `falsolinkedin.com`.
        # Los boletines se penalizan aparte, con `newsletter_local_parts`.
        ignored_senders:
            - linkedin.com
            - facebookmail.com
            - twitter.com
            - x.com
            - instagram.com
            - tiktok.com
            - youtube.com
            - googlealerts-noreply@google.com

        # Partes locales típicas de boletines.
        newsletter_local_parts:
            - newsletter
            - news
            - marketing
            - info
            - hola
            - hello
            - community
            - updates
            - novedades
            - boletin
            - boletín

    # ── Nivel 3: lectura de documentos (ARCHITECTURE.md §13.6) ──────────────
    #
    # El OCR es el último recurso y el más caro: solo se paga cuando el
    # documento no trae capa de texto. Estos valores son decisiones de producto
    # (cuánto estamos dispuestos a gastar por factura), no constantes técnicas.
    #
    # Se declaran como parámetros planos con nombre punteado, y no como un
    # array anidado, porque Symfony NO resuelve el acceso a claves de un array
    # (`%app.processing.ocr.min_characters%` falla con «You cannot access nested
    # array items»). El nombre punteado es solo una convención de lectura: para
    # el contenedor es una clave plana más. Ver D-43.
    # Por debajo de este número de caracteres se considera que el documento no
    # tiene texto de verdad. Un PDF escaneado devuelve metadatos y ruido, y sin
    # umbral ese ruido impediría el OCR.
    app.processing.ocr.min_characters: 40

    # Tope de texto que se guarda y se analiza. Una factura no tiene más.
    app.processing.ocr.max_characters: 200000

    # Binarios. Se declaran aquí para poder apuntar a otra instalación sin
    # tocar el código.
    app.processing.ocr.binary: tesseract
    app.processing.ocr.rasterizer: pdftoppm

    # Español primero: la mayoría de facturas del mercado objetivo lo están.
    app.processing.ocr.languages: 'spa+eng'

    # Una factura escaneada rara vez pasa de cinco páginas, y cada página
    # cuesta segundos de CPU.
    app.processing.ocr.max_pages: 5

    # 300 ppp es el mínimo que lee bien un importe con separador de miles.
    app.processing.ocr.dpi: 300

    # Tiempo máximo que se retiene el cerrojo de OCR. El OCR se serializa para
    # no saturar la máquina (concurrencia muy baja).
    app.processing.ocr.timeout_seconds: 60
