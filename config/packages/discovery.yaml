# Parámetros de la bandeja de descubrimientos (ARCHITECTURE.md §13.10, Fase 12).
#
# Son decisiones de producto: cuánto tiempo vive una propuesta antes de
# expirar y cuánto tiempo se recuerda que el usuario la descartó. Viven aquí y
# no en el código para poder ajustarlos sin desplegar.
#
# Se declaran como un bloque plano porque Symfony no resuelve el acceso a
# claves de un array anidado (D-43): el bloque se consume entero.
parameters:
    app.discovery:
        # Días que una propuesta sigue viva en la bandeja antes de expirar.
        #
        # Expirar no es borrar: la propuesta pasa a `expired` y sale de la
        # bandeja, pero se conserva el histórico. Pasado este tiempo el
        # usuario ya no va a decidir nada sobre ella.
        expiry_days: 90

        # Días durante los que una propuesta ignorada sigue bloqueando nuevas
        # propuestas con la misma clave (mismo proveedor, importe, moneda y
        # periodicidad).
        #
        # Es una ventana, no un veto eterno: si el usuario descartó la
        # suscripción de ejemplo hace seis meses, una factura nueva de ese
        # proveedor vuelve a merecer una pregunta. Sin ventana, descartar una
        # sola vez silenciaría al proveedor para siempre.
        ignore_suppression_days: 90

        # ── Fase 15: detección de cambios ───────────────────────────────────
        #
        # Umbrales del barrido sobre el inventario. Son los parámetros que
        # deciden qué se considera «un cobro que no ha llegado» o «un servicio
        # sin actividad», y por eso son de producto: cambiarlos cambia lo que
        # el usuario ve en la bandeja de sugerencias.
        #
        # `missing_charge_grace_days`
        #   Días de margen tras la fecha de cobro esperada antes de sospechar
        #   que la factura no va a llegar. Sin margen, cualquier proveedor
        #   que factura un día tarde generaría un aviso falso.
        missing_charge_grace_days: 7

        # `dormant_service_days`
        #   Días sin facturas, renovaciones ni documentos antes de sugerir que
        #   el servicio está inactivo.
        dormant_service_days: 180

        # `duplicate_amount_tolerance`
        #   Tolerancia al comparar importes (0.02 = 2 %). Dos servicios con
        #   importes «prácticamente iguales» son sospechosos de ser el mismo.
        duplicate_amount_tolerance: 0.02

        # `duplicate_name_similarity`
        #   Similitud mínima entre los nombres, en porcentaje, para sospechar
        #   de un duplicado.
        duplicate_name_similarity: 85
