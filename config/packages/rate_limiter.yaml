framework:
    rate_limiter:
        # La dirección de ingesta por reenvío es pública por definición: cualquiera
        # que la conozca puede intentar escribir en ella. El límite no protege de
        # un atacante decidido, pero evita que un bucle de reenvío mal configurado
        # en el correo del propio usuario llene la cola (SECURITY.md §2.4).
        inbound_email:
            policy: 'sliding_window'
            limit: 120
            interval: '1 hour'

        # Límite de llamadas de IA por organización y minuto (Fase 14).
        #
        # El presupuesto protege el bolsillo; esto protege la operación. Un
        # proveedor que devuelve errores en bucle genera llamadas que no
        # cuestan dinero pero sí consumen cuota, ralentizan la sincronización
        # y llenan la traza. Un buzón con un mailing que rebota puede pedir
        # la misma extracción cientos de veces en una sola sincronización.
        #
        # Cuenta **mensajes enviados a la escalera de IA**, no llamadas al
        # proveedor: un mensaje puede llegar a hacer dos (nivel 5 y nivel 6),
        # así que el tope real de llamadas es el doble.
        ai_calls:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

        # Operaciones pesadas del buzon (Fase 16).
        #
        # Conectar, probar y sincronizar un buzon abre una conexion IMAP, y
        # sincronizar ademas lanza la escalera de IA. Un bucle de peticiones
        # desde la sesion de un usuario agotaria la cuota del servidor de
        # correo y la del proveedor de IA. El limite es por organizacion:
        # un cliente pesado no puede dejar sin servicio a los demas.
        mail_account:
            policy: 'sliding_window'
            limit: 10
            interval: '1 minute'

        # Deteccion automatica del servidor IMAP (D-93).
        #
        # Cada deteccion son unas cuantas consultas DNS y hasta seis conexiones
        # TCP contra el dominio que el usuario escriba. El limite existe para
        # que el formulario no se pueda usar como sonda de red: es barato de
        # hacer y no tiene por que ser ilimitado.
        mail_discovery:
            policy: 'sliding_window'
            limit: 15
            interval: '1 minute'

        # Subida de documentos (Fase 16).
        #
        # Cada documento ocupa almacenamiento permanente. Limitarlo por
        # organizacion evita que una sesion comprometida llene el disco.
        document_upload:
            policy: 'sliding_window'
            limit: 20
            interval: '1 minute'

        # Exportacion de datos (Fase 16).
        #
        # Exportar recorre toda la organizacion y arma un fichero en memoria.
        # Es una operacion de lectura pesada, y en un momento en que el
        # usuario puede estar pidiendo el derecho de acceso conviene que no
        # se abuse de ella.
        privacy_export:
            policy: 'sliding_window'
            limit: 5
            interval: '1 minute'

        # API publica (Fase 18).
        #
        # El limite es **por clave de API**, no por organizacion ni por IP: la
        # clave es la unidad real de consumo y la que se puede explicar ("su
        # clave sk_a1B2... ha superado el limite de 300 peticiones por
        # minuto"). Varias claves pueden salir del mismo servidor (NAT, proxy,
        # CI), asi que un limite por IP castigaria a un cliente por el
        # comportamiento de otro.
        api:
            policy: 'sliding_window'
            limit: 300
            interval: '1 minute'

        # Formulario de contacto de la web corporativa (Fase 23).
        #
        # Es el unico formulario publico que manda correo a una direccion
        # nuestra, asi que es el unico que puede convertir la bandeja de
        # entrada en un basurero. El limite es por IP y generoso: quien
        # escribe de verdad manda uno o dos mensajes, y quien manda veinte no
        # esta escribiendo, esta probando.
        contact_form:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
