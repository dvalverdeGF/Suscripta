security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Identity\Domain\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # La API publica (Fase 18) va **antes** del firewall principal.
        #
        # Es sin estado: no hay sesion, no hay cookie y no hay CSRF. La
        # credencial viaja en la cabecera y se comprueba en cada peticion, que
        # es lo que necesita un integrador que llama desde su propio
        # servidor.
        #
        # `stateless: true` es importante: sin el, Symfony intentaria guardar
        # la sesion del token en la cookie y una peticion sin cookie recibiria
        # un 302 en lugar de un 401. Una API que redirige no es una API.
        api:
            pattern: ^/api/v1
            stateless: true
            custom_authenticators:
                - App\Api\Infrastructure\Security\ApiKeyAuthenticator
            entry_point: App\Api\UI\Security\ApiAuthenticationEntryPoint
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                path: /
                always_remember_me: false
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register$, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/verify/email, roles: PUBLIC_ACCESS }
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        # La ingesta por reenvío llega de un servidor de correo, sin sesión. La
        # autenticación es la propia dirección dedicada más la lista de
        # remitentes autorizados (SECURITY.md §2.4).
        - { path: ^/mail/inbound$, roles: PUBLIC_ACCESS }
        # La API publica (Fase 18) exige una clave valida en TODAS sus rutas.
        #
        # El `OPTIONS` queda abierto porque es el *preflight* de CORS: el
        # navegador lo envia sin credenciales (no puede mandarlas en un
        # preflight) y, si el servidor lo rechazara, la peticion real nunca
        # llegaria a salir. El preflight no devuelve datos ni cambia nada, asi
        # que no necesita autenticacion.
        # La documentacion de la API es publica (Fase 18).
        #
        # Un integrador tiene que poder LEER como se usa la API antes de
        # tener una clave. Si la documentacion exigiera una clave, el primer
        # paso del integrador seria imposible: Tendria que pedir una clave
        # para poder preguntar como se pide una clave. La documentacion no
        # devuelve datos de ningun cliente, solo describe el contrato.
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1, methods: [OPTIONS], roles: PUBLIC_ACCESS }
        - { path: ^/api/v1, roles: IS_AUTHENTICATED_FULLY }
        # ── Web corporativa (Fase 23) ────────────────────────────────────
        # Cada pagina publica se lista **una por una** a proposito. La regla
        # general de abajo exige ROLE_USER, asi que lo que no esta aqui es
        # privado: olvidar una pagina da un 403 visible en el primer test, y
        # olvidar una regla `deny` daria una pagina privada expuesta. El
        # defecto seguro es el que cierra.
        #
        # `tests/Functional/Website/PublicPagesTest.php` recorre todas las rutas
        # `app_site_*` sin sesion, de modo que anadir una pagina y olvidar esta
        # lista rompe la suite (D-84).
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/producto$, roles: PUBLIC_ACCESS }
        - { path: ^/como-funciona$, roles: PUBLIC_ACCESS }
        - { path: ^/precios$, roles: PUBLIC_ACCESS }
        - { path: ^/integraciones$, roles: PUBLIC_ACCESS }
        - { path: ^/seguridad$, roles: PUBLIC_ACCESS }
        - { path: ^/preguntas-frecuentes$, roles: PUBLIC_ACCESS }
        - { path: ^/contacto$, roles: PUBLIC_ACCESS }
        - { path: ^/aviso-legal$, roles: PUBLIC_ACCESS }
        - { path: ^/privacidad$, roles: PUBLIC_ACCESS }
        - { path: ^/condiciones$, roles: PUBLIC_ACCESS }
        - { path: ^/sitemap\.xml$, roles: PUBLIC_ACCESS }
        - { path: ^/robots\.txt$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
