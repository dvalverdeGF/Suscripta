# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Dominio de las direcciones de ingesta por reenvío (D-21).
    app.mail.forwarding_domain: '%env(MAIL_FORWARDING_DOMAIN)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Los canales de notificación se recogen por etiqueta: añadir uno nuevo
    # (un webhook, por ejemplo) es escribir la clase y nada más.
    _instanceof:
        App\Notifications\Application\Channel\NotificationChannelInterface:
            tags: ['app.notification_channel']
        # Los extractores de texto y los parsers de proveedor se recogen por
        # etiqueta: añadir un formato o un proveedor nuevo es escribir la clase
        # y nada más (ARCHITECTURE.md §13.6, §13.7).
        App\Processing\Domain\Text\DocumentTextExtractorInterface:
            tags: ['app.document_text_extractor']
        App\Processing\Domain\Provider\ProviderParserInterface:
            tags: ['app.provider_parser']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # El cifrado de credenciales de buzón necesita el secreto de la aplicación.
    # Se inyecta explícitamente para que la clase no dependa de un parámetro
    # global y sea trivial de sustituir en un test.
    App\Mailbox\Infrastructure\Crypto\SodiumCredentialCipher:
        arguments:
            $appSecret: '%env(APP_SECRET)%'

    # El cliente IMAP se declara como alias explícito y no se deja al
    # autowiring: un alias implícito no es un servicio real, así que los tests
    # funcionales no podrían sustituirlo por un doble y acabarían abriendo
    # conexiones de verdad contra `imap.miempresa.com`.
    App\Mailbox\Application\Imap\ImapClientInterface: '@App\Mailbox\Infrastructure\Imap\WebklexImapClient'

    # El limitador de frecuencia de la ingesta por reenvío se declara en
    # `config/packages/rate_limiter.yaml`; aquí solo se le dice a la clase cuál
    # de los limitadores registrados le corresponde.
    App\Mailbox\Application\Forwarding\IngestForwardedEmail:
        arguments:
            $inboundEmailLimiter: '@limiter.inbound_email'

    App\Mailbox\Application\Forwarding\ForwardingAddressFactory:
        arguments:
            $domain: '%app.mail.forwarding_domain%'

    App\Notifications\Application\Channel\NotificationChannelRegistry:
        arguments:
            $channels: !tagged_iterator app.notification_channel

    # Los binarios viven fuera del directorio público: se sirven solo a través
    # de un controlador que comprueba permisos (SECURITY.md §1).
    App\Documents\Domain\Service\DocumentStorageInterface: '@App\Documents\Infrastructure\Storage\LocalDocumentStorage'

    App\Documents\Infrastructure\Storage\LocalDocumentStorage:
        arguments:
            $directory: '%kernel.project_dir%/var/storage'

    # Los pesos del filtro determinista son configuración de producto
    # (config/packages/processing.yaml), no constantes del código.
    App\Processing\Application\Billing\BillingScoreWeights:
        factory: ['App\Processing\Application\Billing\BillingScoreWeights', 'fromArray']
        arguments:
            $config: '%app.processing.billing_score%'

    # El pipeline depende del puerto, no de la implementación: qué merece
    # analizarse es una política de producto y debe poder sustituirse sin tocar
    # el orquestador (D-31).
    App\Processing\Domain\Billing\BillingClassifierInterface: '@App\Processing\Application\Billing\BillingScoreCalculator'

    # ── Nivel 3: lectura de documentos (ARCHITECTURE.md §13.6) ──────────────
    # El orden importa: se prueba el primero que reconozca el formato. El PDF va
    # antes que el texto plano porque un PDF también responde a `application/*`
    # y no queremos que un extractor genérico se lo quede.
    App\Processing\Application\Text\DocumentTextExtractorRegistry:
        arguments:
            $extractors: !tagged_iterator app.document_text_extractor

    App\Processing\Application\Text\ExtractDocumentText:
        arguments:
            $minCharacters: '%app.processing.ocr.min_characters%'
            $maxCharacters: '%app.processing.ocr.max_characters%'

    # El OCR es opcional por diseño: si Tesseract no está instalado, el motor
    # nulo hace que el pipeline degrade a IA o a revisión en lugar de fallar.
    App\Processing\Domain\Ocr\OcrEngineInterface: '@App\Processing\Infrastructure\Ocr\TesseractOcrEngine'

    App\Processing\Infrastructure\Ocr\TesseractOcrEngine:
        arguments:
            $binary: '%app.processing.ocr.binary%'
            $rasterizer: '%app.processing.ocr.rasterizer%'
            $languages: '%app.processing.ocr.languages%'
            $maxPages: '%app.processing.ocr.max_pages%'
            $dpi: '%app.processing.ocr.dpi%'
            $timeoutSeconds: '%app.processing.ocr.timeout_seconds%'

    # ── Nivel 4: conocimiento de proveedores (ARCHITECTURE.md §13.7) ────────
    App\Processing\Application\Provider\ProviderParserRegistry:
        arguments:
            $parsers: !tagged_iterator app.provider_parser

    App\Processing\Domain\Provider\ProviderResolverInterface: '@App\Processing\Application\Provider\ProviderResolver'
