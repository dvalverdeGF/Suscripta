# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Dominio de las direcciones de ingesta por reenvío (D-21).
    app.mail.forwarding_domain: '%env(MAIL_FORWARDING_DOMAIN)%'

    # ── Web corporativa (Fase 23) ────────────────────────────────────────
    # URL publica del sitio y buzon que recibe el formulario de contacto. Las
    # dos son entorno y no constantes: en local no son las de produccion.
    app.site.url: '%env(SITE_URL)%'
    app.site.contact_email: '%env(SITE_CONTACT_EMAIL)%'

    # ── API publica (Fase 18) ────────────────────────────────────────────
    # Secreto de reserva para firmar las claves de API. Si se define
    # `API_KEY_PEPPER` en el entorno, manda ese valor.
    app.api.pepper_fallback: '%kernel.secret%'

    # Orígenes de navegador permitidos a llamar a la API (CORS). Es una lista
    # porque la comparación es exacta: un origen no listado no recibe la
    # cabecera `Access-Control-Allow-Origin` y el navegador lo bloquea.
    app.api.cors_allowed_origins: '%env(json:API_CORS_ALLOWED_ORIGINS)%'

    # ── IA (ARCHITECTURE.md §13.8, §13.9) ────────────────────────────────
    # Longitud máxima del texto que se manda a un modelo tras el redactado.
    # Es un límite de coste: el texto que se recorta es texto que no se
    # procesa, y lo que queda es lo que suele contener los datos de la factura.
    app.ai.max_text_length: 8000

    # Confianza determinista por debajo de la cual un documento se considera
    # «raro» y se puede escalar al nivel 6 (IA avanzada).
    app.ai.advanced.confidence_threshold: 0.3

    # Longitud de texto a partir de la cual un documento sin importe se
    # considera complejo y merece un modelo grande.
    app.ai.advanced.max_text_length: 8000

    # Coste máximo por organización y mes, en céntimos.
    #
    # El presupuesto es lo que convierte «IA activada» en algo responsable:
    # sin tope, un correo mal formado en bucle puede vaciar la cuenta del
    # cliente. Al superarlo, el pipeline degrada (modo blando) o se para
    # (modo duro) en vez de seguir gastando (D-55, D-56).
    app.ai.budget.monthly_minor: 500

    # Qué pasa al agotarse el presupuesto cuando la organización no ha elegido
    # nada: `SOFT` degrada (sigue la IA económica) y `HARD` para (aplaza los
    # correos). Degradar es el valor por defecto porque para el trabajo es
    # menos dañino que pararse.
    #
    # Se declara con `!php/enum` para que el contenedor entregue el
    # enumerado y no un texto: la clase pide el tipo, y convertirlo a mano en
    # cada sitio es justo el error que el tipado evita.
    app.ai.budget.default_mode: !php/enum App\Ai\Domain\Enum\AiBudgetMode::SOFT

    # Porcentaje de uso del presupuesto a partir del cual se avisa al
    # usuario. Es un porcentaje y no un importe porque el aviso tiene que
    # llegar antes de que el dinero se acabe, y eso depende del tamaño del
    # presupuesto, no de una cantidad fija.
    app.ai.budget.warning_percent: 80

    # Correos por minuto y organización que pueden entrar en la escalera de
    # IA (Fase 14).
    #
    # El presupuesto protege el bolsillo; esto protege la operación. Un
    # proveedor que devuelve errores en bucle genera llamadas que no cuestan
    # dinero pero sí consumen cuota y ralentizan la sincronización.
    app.ai.rate_limit.calls_per_minute: 60

    # ── Cuenta de demostración (D-67) ────────────────────────────────────
    # Credenciales de la cuenta de ejemplo. Vienen del entorno y no de
    # constantes, para que la contraseña real viva en `.env.local` y el
    # repositorio solo lleve un valor de relleno.
    #
    # Los valores de reserva son los mismos que trae `.env`: si alguien borra
    # la variable del entorno, la demostración sigue funcionando con la
    # cuenta de relleno en lugar de romper la aplicación al arrancar.
    #
    # La contraseña solo se muestra en la pantalla de login del entorno de
    # desarrollo; en cualquier otro, la función de Twig devuelve `null` y no
    # se pinta nada.
    app.demo.email: '%env(default:app.demo.email.fallback:DEMO_ACCOUNT_EMAIL)%'
    app.demo.email.fallback: 'demo@suscripta.local'
    app.demo.password: '%env(default:app.demo.password.fallback:DEMO_ACCOUNT_PASSWORD)%'
    app.demo.password.fallback: 'demo1234'
    app.demo.label: '%env(default:app.demo.label.fallback:DEMO_ACCOUNT_LABEL)%'
    app.demo.label.fallback: 'Cuenta de demostración'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Los canales de notificación se recogen por etiqueta: añadir uno nuevo
    # (un webhook, por ejemplo) es escribir la clase y nada más.
    _instanceof:
        App\Notifications\Application\Channel\NotificationChannelInterface:
            tags: ['app.notification_channel']
        # Los extractores de texto y los parsers de proveedor se recogen por
        # etiqueta: añadir un formato o un proveedor nuevo es escribir la clase
        # y nada más (ARCHITECTURE.md §13.6, §13.7).
        App\Processing\Domain\Text\DocumentTextExtractorInterface:
            tags: ['app.document_text_extractor']
        App\Processing\Domain\Provider\ProviderParserInterface:
            tags: ['app.provider_parser']
        # Los proveedores de IA se recogen por etiqueta: añadir uno nuevo es
        # escribir la clase y registrar la integración en el catálogo.
        App\Ai\Domain\Contract\AiProviderInterface:
            tags: ['app.ai_provider']
        # Los extractores de documento se recogen por etiqueta: la escalera de
        # niveles se monta con las clases, no con un `switch` (ARCHITECTURE.md §13.8).
        App\Ai\Domain\Contract\DocumentExtractorInterface:
            tags: ['app.document_extractor']
        # Los tres puertos de privacidad (Fase 16). Cada módulo publica lo
        # suyo y el módulo `Privacy` lo agrega: exportar o borrar una
        # organización entera no obliga a que nadie toque las entidades de
        # otro (ARCHITECTURE.md §15).
        App\Shared\Application\Privacy\OrganizationDataProviderInterface:
            tags: ['app.privacy_export']
        App\Shared\Application\Privacy\OrganizationDataRemoverInterface:
            tags: ['app.privacy_remove']
        App\Shared\Application\Privacy\RetentionPurgerInterface:
            tags: ['app.privacy_purger']
        # Los contadores de uso de cada capacidad se recogen por etiqueta
        # (Fase 17). Cada módulo publica el suyo —cuántos servicios, buzones
        # o documentos tiene la organización— y el guard de cuotas los cruza
        # con el límite del plan. Añadir un límite nuevo es escribir una
        # clase, no tocar el núcleo (ARCHITECTURE.md §16).
        App\Shared\Application\Entitlements\EntitlementUsageProviderInterface:
            tags: ['app.entitlement_usage']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # El cifrado de credenciales de buzón necesita el secreto de la aplicación.
    # Se inyecta explícitamente para que la clase no dependa de un parámetro
    # global y sea trivial de sustituir en un test.
    App\Mailbox\Infrastructure\Crypto\SodiumCredentialCipher:
        arguments:
            $appSecret: '%env(APP_SECRET)%'

    # El cliente IMAP se declara como alias explícito y no se deja al
    # autowiring: un alias implícito no es un servicio real, así que los tests
    # funcionales no podrían sustituirlo por un doble y acabarían abriendo
    # conexiones de verdad contra `imap.miempresa.com`.
    App\Mailbox\Application\Imap\ImapClientInterface: '@App\Mailbox\Infrastructure\Imap\WebklexImapClient'

    # El limitador de frecuencia de la ingesta por reenvío se declara en
    # `config/packages/rate_limiter.yaml`; aquí solo se le dice a la clase cuál
    # de los limitadores registrados le corresponde.
    App\Mailbox\Application\Forwarding\IngestForwardedEmail:
        arguments:
            $inboundEmailLimiter: '@limiter.inbound_email'

    App\Mailbox\Application\Forwarding\ForwardingAddressFactory:
        arguments:
            $domain: '%app.mail.forwarding_domain%'

    App\Notifications\Application\Channel\NotificationChannelRegistry:
        arguments:
            $channels: !tagged_iterator app.notification_channel

    # Los binarios viven fuera del directorio público: se sirven solo a través
    # de un controlador que comprueba permisos (SECURITY.md §1).
    App\Documents\Domain\Service\DocumentStorageInterface: '@App\Documents\Infrastructure\Storage\LocalDocumentStorage'

    App\Documents\Infrastructure\Storage\LocalDocumentStorage:
        arguments:
            $directory: '%kernel.project_dir%/var/storage'

    # Los pesos del filtro determinista son configuración de producto
    # (config/packages/processing.yaml), no constantes del código.
    App\Processing\Application\Billing\BillingScoreWeights:
        factory: ['App\Processing\Application\Billing\BillingScoreWeights', 'fromArray']
        arguments:
            $config: '%app.processing.billing_score%'

    # El read model de servicios (Fase 12). Es un servicio explícito, y no un
    # alias, porque tiene su propia implementación: el repositorio de escritura
    # devuelve entidades y este devuelve vistas. Ver ARCHITECTURE.md §3.
    App\Services\Domain\Repository\ServiceViewRepositoryInterface: '@App\Services\Infrastructure\Repository\ServiceViewRepository'

    # Los pesos del matching de servicios son configuración de producto
    # (config/packages/processing.yaml), igual que los del filtro de facturación.
    App\Processing\Application\Matching\ServiceMatchWeights:
        factory: ['App\Processing\Application\Matching\ServiceMatchWeights', 'fromArray']
        arguments:
            $config: '%app.processing.matching%'

    # Los parámetros de la bandeja de descubrimientos (cuánto vive una
    # propuesta, cuánto se recuerda que el usuario la descartó) son política de
    # producto: config/packages/discovery.yaml.
    App\Discovery\Application\DiscoverySettings:
        factory: ['App\Discovery\Application\DiscoverySettings', 'fromArray']
        arguments:
            $config: '%app.discovery%'

    # Los umbrales del barrido de detección de cambios (Fase 15) son política
    # de producto: config/packages/discovery.yaml.
    App\Discovery\Application\Change\ChangeSettings:
        factory: ['App\Discovery\Application\Change\ChangeSettings', 'fromArray']
        arguments:
            $config: '%app.discovery%'

    # Los parámetros del conocimiento aprendido del buzón (Fase 13) son
    # política de producto: config/packages/knowledge.yaml.
    App\Processing\Application\Knowledge\KnowledgeSettings:
        factory: ['App\Processing\Application\Knowledge\KnowledgeSettings', 'fromArray']
        arguments:
            $config: '%app.knowledge%'

    # El pipeline depende del puerto, no de la implementación: qué merece
    # analizarse es una política de producto y debe poder sustituirse sin tocar
    # el orquestador (D-31).
    App\Processing\Domain\Billing\BillingClassifierInterface: '@App\Processing\Application\Billing\BillingScoreCalculator'

    # El emparejamiento con el inventario también es política de producto: qué
    # señales pesan y qué puntuación asocia sola (ARCHITECTURE.md §13.10, D-35).
    App\Processing\Domain\Matching\ServiceMatcherInterface: '@App\Processing\Application\Matching\ServiceMatcher'

    # La detección de periodicidad es determinista por diseño (ARCHITECTURE.md §9):
    # el puerto existe para poder sustituirla, no porque la implementación vaya a
    # cambiar pronto.
    App\Discovery\Domain\Recurrence\RecurrenceDetectorInterface: '@App\Discovery\Application\Recurrence\IntervalRecurrenceDetector'

    # ── Nivel 3: lectura de documentos (ARCHITECTURE.md §13.6) ──────────────
    # El orden importa: se prueba el primero que reconozca el formato. El PDF va
    # antes que el texto plano porque un PDF también responde a `application/*`
    # y no queremos que un extractor genérico se lo quede.
    App\Processing\Application\Text\DocumentTextExtractorRegistry:
        arguments:
            $extractors: !tagged_iterator app.document_text_extractor

    App\Processing\Application\Text\ExtractDocumentText:
        arguments:
            $minCharacters: '%app.processing.ocr.min_characters%'
            $maxCharacters: '%app.processing.ocr.max_characters%'

    # El OCR es opcional por diseño: si Tesseract no está instalado, el motor
    # nulo hace que el pipeline degrade a IA o a revisión en lugar de fallar.
    App\Processing\Domain\Ocr\OcrEngineInterface: '@App\Processing\Infrastructure\Ocr\TesseractOcrEngine'

    App\Processing\Infrastructure\Ocr\TesseractOcrEngine:
        arguments:
            $binary: '%app.processing.ocr.binary%'
            $rasterizer: '%app.processing.ocr.rasterizer%'
            $languages: '%app.processing.ocr.languages%'
            $maxPages: '%app.processing.ocr.max_pages%'
            $dpi: '%app.processing.ocr.dpi%'
            $timeoutSeconds: '%app.processing.ocr.timeout_seconds%'

    # ── Nivel 4: conocimiento de proveedores (ARCHITECTURE.md §13.7) ────────
    App\Processing\Application\Provider\ProviderParserRegistry:
        arguments:
            $parsers: !tagged_iterator app.provider_parser

    App\Processing\Domain\Provider\ProviderResolverInterface: '@App\Processing\Application\Provider\ProviderResolver'

    # ── Fase 11: IA e integraciones (ARCHITECTURE.md §13.8, §13.9) ────────
    # El registro de proveedores de IA se construye con las clases etiquetadas.
    # Es la única lista de proveedores que existe: el panel de integraciones
    # la consulta, y el selector también, de modo que no pueden divergir.
    App\Ai\Infrastructure\Provider\AiProviderRegistry:
        arguments:
            $providers: !tagged_iterator app.ai_provider

    App\Ai\Domain\Contract\AiProviderRegistryInterface: '@App\Ai\Infrastructure\Provider\AiProviderRegistry'

    # El selector de proveedor es la política de «qué IA se usa para cada
    # necesidad». La implementación vive en `Ai\Application` porque decide
    # sobre datos del dominio (la elección de la organización).
    App\Ai\Domain\Contract\AiProviderSelectorInterface: '@App\Ai\Application\AiPurposeSelector'

    # La escalera de niveles: se recorren en orden, y cada extractor decide si
    # le toca. El orden importa, así que se declara explícitamente en vez de
    # confiar en el orden de discovery del contenedor.
    App\Ai\Application\Extraction\DocumentExtractorChain:
        arguments:
            $extractors:
                - '@App\Ai\Application\Extraction\AiDocumentExtractor'
                - '@App\Ai\Application\Extraction\AdvancedAiDocumentExtractor'

    App\Ai\Application\RedactContent:
        arguments:
            $maxLength: '%app.ai.max_text_length%'

    App\Ai\Application\Extraction\AdvancedAiDocumentExtractor:
        arguments:
            $confidenceThreshold: '%app.ai.advanced.confidence_threshold%'
            $maxTextLength: '%app.ai.advanced.max_text_length%'

    # El presupuesto se comprueba **antes** de cada llamada, así que su tope
    # es un parámetro de la aplicación y no una constante del código: es una
    # decisión comercial (lo que se está dispuesto a gastar por organización
    # y mes) y tiene que poder cambiar sin tocar PHP (D-55).
    App\Ai\Application\AiBudgetGuard:
        arguments:
            $defaultLimitMinor: '%app.ai.budget.monthly_minor%'
            $defaultMode: '%app.ai.budget.default_mode%'
            $warningPercent: '%app.ai.budget.warning_percent%'

    # El limitador de llamadas de IA se declara en
    # `config/packages/rate_limiter.yaml`; aquí solo se le dice a la clase
    # cuál de los limitadores registrados le corresponde.
    App\Ai\Application\AiCallRateLimiter:
        arguments:
            $limiter: '@limiter.ai_calls'

    # El pipeline depende de la puerta, no de la implementación: qué se manda
    # a un modelo y con qué presupuesto es política del módulo de IA, y el
    # pipeline no debe saber de eso (D-08).
    App\Ai\Application\AiExtractionInterface: '@App\Ai\Application\AiExtractionService'

    # El módulo de IA no conoce lo que quedó a medias en el pipeline, así que
    # declara lo que espera (un puerto) y el módulo de `Processing` lo
    # implementa (un adaptador). La dependencia va en un solo sentido:
    # `Processing → Ai` (Fase 14, D-56).
    App\Ai\Application\AiBudgetChangeHandlerInterface: '@App\Processing\Application\ReleaseDeferredMessages'

    # ── Fase 16: privacidad y RGPD (ARCHITECTURE.md §15) ───────────────

    # La política de retención es un bloque plano de parámetros que
    # `PrivacySettings` convierte en un objeto tipado: cambiar un plazo es
    # tocar la configuración, no el código (SECURITY.md §6).
    App\Shared\Application\Privacy\PrivacySettings:
        factory: ['App\Shared\Application\Privacy\PrivacySettings', 'fromArray']
        arguments:
            $config: '%app.privacy%'

    # La puerta de frecuencia compartida necesita acceso a **todos** los
    # limitadores registrados, no a uno concreto: el limitador lo decide quien
    # llama (`mail_account`, `document_upload`, `privacy_export`). Por eso
    # recibe un localizador de servicios en vez de una factoría.
    App\Shared\Application\RateLimit\RateLimitGuard:
        arguments:
            $limiters: !tagged_locator { tag: 'rate_limiter', index_by: 'name' }

    # El libro de auditoría es transversal: lo escriben todos los módulos, y
    # por eso vive en `Shared`.
    App\Shared\Domain\Repository\AuditLogRepositoryInterface: '@App\Shared\Infrastructure\Repository\AuditLogRepository'

    # Los tres agregadores de privacidad solo conocen los puertos: la lista de
    # secciones, de módulos y de categorías la aporta cada módulo con su
    # propia etiqueta. Añadir un módulo con datos que exportar es escribir una
    # clase y nada más.
    App\Privacy\Application\ExportOrganizationData:
        arguments:
            $providers: !tagged_iterator app.privacy_export

    App\Privacy\Application\DeleteOrganizationData:
        arguments:
            $removers: !tagged_iterator app.privacy_remove

    App\Privacy\Application\PurgeExpiredData:
        arguments:
            $purgers: !tagged_iterator app.privacy_purger

    # El puerto de limpieza del conocimiento aprendido lo declara el módulo de
    # buzón (lo necesita al desconectar) y lo implementa el de procesamiento
    # (es quien sabe qué es). La dependencia va en un solo sentido.
    App\Mailbox\Application\MailboxKnowledgeCleanerInterface: '@App\Processing\Application\Knowledge\ClearMailboxKnowledge'

    # ── Fase 17: preparación SaaS (ARCHITECTURE.md §16) ─────────────────

    # Los límites de cada plan son configuración, no código: subirlos es
    # tocar el YAML, no desplegar (D-64). El bloque se consume entero porque
    # Symfony no resuelve el acceso a claves de un array anidado (D-43).
    App\Shared\Application\Entitlements\EntitlementSettings:
        factory: ['App\Shared\Application\Entitlements\EntitlementSettings', 'fromArray']
        arguments:
            $config: '%app.entitlements%'

    # El checker se declara como alias explícito para que el núcleo hable con
    # la interfaz y no con la implementación: los límites de un plan se
    # podrían resolver de otra forma (una pasarela de pago, un contrato) sin
    # tocar a quien los consume.
    App\Shared\Application\Entitlements\EntitlementCheckerInterface: '@App\Shared\Infrastructure\Entitlements\PlanEntitlementChecker'

    # El guard cruza el límite del plan con el uso real. Los contadores los
    # publica cada módulo con su propia etiqueta: el guard no conoce ningún
    # módulo de negocio, solo sabe preguntar «cuánto se usa» por capacidad.
    App\Shared\Application\Entitlements\QuotaGuard:
        arguments:
            $usageProviders: !tagged_locator { tag: 'app.entitlement_usage', index_by: 'capability' }

    # Los casos de uso hablan con el puerto, no con la implementación: así no
    # necesitan la configuración de planes para poder probarse, y el límite
    # se podría resolver de otra forma (una pasarela de pago) sin tocar a
    # quien lo consume.
    App\Shared\Application\Entitlements\QuotaCheckerInterface: '@App\Shared\Application\Entitlements\QuotaGuard'

    # ── Fase 18: API publica (ARCHITECTURE.md §17) ───────────────────────

    # La huella de una clave de API se firma con un secreto del servidor.
    #
    # Si nadie define `API_KEY_PEPPER`, se usa el `APP_SECRET` de la
    # aplicación. Es un valor razonable como reserva (el proyecto ya lo
    # necesita para otras cosas), pero conviene fijar una variable propia en
    # producción: cambiar el `APP_SECRET` invalidaría todas las claves de API
    # ya emitidas, y con ellas las integraciones de los clientes.
    App\Api\Application\ApiKeyFactory:
        arguments:
            $pepper: '%env(default:app.api.pepper_fallback:API_KEY_PEPPER)%'

    # Los orígenes de CORS son una lista, no un texto: el listener de CORS
    # necesita compararlos uno a uno. Vienen del entorno en JSON para que
    # añadirlos sea cambiar una variable, sin tocar el YAML.
    App\Api\UI\EventListener\ApiCorsListener:
        arguments:
            $allowedOrigins: '%app.api.cors_allowed_origins%'

    # Los read models de la API hablan con interfaces, igual que el
    # backoffice. Cada módulo declara su implementación: así la API no
    # depende de cómo se guardan los datos, y un test puede sustituirlos.
    App\Notifications\Domain\Repository\AlertViewRepositoryInterface: '@App\Notifications\Infrastructure\Repository\AlertViewRepository'
    App\Documents\Domain\Repository\DocumentViewRepositoryInterface: '@App\Documents\Infrastructure\Repository\DocumentViewRepository'
    App\Discovery\Domain\Repository\DiscoveryViewRepositoryInterface: '@App\Discovery\Infrastructure\Repository\DiscoveryViewRepository'
    App\Mailbox\Domain\Repository\EmailAccountViewRepositoryInterface: '@App\Mailbox\Infrastructure\Repository\EmailAccountViewRepository'
