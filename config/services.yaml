# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Dominio de las direcciones de ingesta por reenvío (D-21).
    app.mail.forwarding_domain: '%env(MAIL_FORWARDING_DOMAIN)%'

    # ── IA (ARCHITECTURE.md §13.8, §13.9) ────────────────────────────────
    # Longitud máxima del texto que se manda a un modelo tras el redactado.
    # Es un límite de coste: el texto que se recorta es texto que no se
    # procesa, y lo que queda es lo que suele contener los datos de la factura.
    app.ai.max_text_length: 8000

    # Confianza determinista por debajo de la cual un documento se considera
    # «raro» y se puede escalar al nivel 6 (IA avanzada).
    app.ai.advanced.confidence_threshold: 0.3

    # Longitud de texto a partir de la cual un documento sin importe se
    # considera complejo y merece un modelo grande.
    app.ai.advanced.max_text_length: 8000

    # Coste máximo por organización y mes, en céntimos.
    #
    # El presupuesto es lo que convierte «IA activada» en algo responsable:
    # sin tope, un correo mal formado en bucle puede vaciar la cuenta del
    # cliente. Al superarlo, el pipeline degrada a revisión manual en vez de
    # seguir gastando.
    app.ai.budget.monthly_minor: 500

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Los canales de notificación se recogen por etiqueta: añadir uno nuevo
    # (un webhook, por ejemplo) es escribir la clase y nada más.
    _instanceof:
        App\Notifications\Application\Channel\NotificationChannelInterface:
            tags: ['app.notification_channel']
        # Los extractores de texto y los parsers de proveedor se recogen por
        # etiqueta: añadir un formato o un proveedor nuevo es escribir la clase
        # y nada más (ARCHITECTURE.md §13.6, §13.7).
        App\Processing\Domain\Text\DocumentTextExtractorInterface:
            tags: ['app.document_text_extractor']
        App\Processing\Domain\Provider\ProviderParserInterface:
            tags: ['app.provider_parser']
        # Los proveedores de IA se recogen por etiqueta: añadir uno nuevo es
        # escribir la clase y registrar la integración en el catálogo.
        App\Ai\Domain\Contract\AiProviderInterface:
            tags: ['app.ai_provider']
        # Los extractores de documento se recogen por etiqueta: la escalera de
        # niveles se monta con las clases, no con un `switch` (ARCHITECTURE.md §13.8).
        App\Ai\Domain\Contract\DocumentExtractorInterface:
            tags: ['app.document_extractor']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # El cifrado de credenciales de buzón necesita el secreto de la aplicación.
    # Se inyecta explícitamente para que la clase no dependa de un parámetro
    # global y sea trivial de sustituir en un test.
    App\Mailbox\Infrastructure\Crypto\SodiumCredentialCipher:
        arguments:
            $appSecret: '%env(APP_SECRET)%'

    # El cliente IMAP se declara como alias explícito y no se deja al
    # autowiring: un alias implícito no es un servicio real, así que los tests
    # funcionales no podrían sustituirlo por un doble y acabarían abriendo
    # conexiones de verdad contra `imap.miempresa.com`.
    App\Mailbox\Application\Imap\ImapClientInterface: '@App\Mailbox\Infrastructure\Imap\WebklexImapClient'

    # El limitador de frecuencia de la ingesta por reenvío se declara en
    # `config/packages/rate_limiter.yaml`; aquí solo se le dice a la clase cuál
    # de los limitadores registrados le corresponde.
    App\Mailbox\Application\Forwarding\IngestForwardedEmail:
        arguments:
            $inboundEmailLimiter: '@limiter.inbound_email'

    App\Mailbox\Application\Forwarding\ForwardingAddressFactory:
        arguments:
            $domain: '%app.mail.forwarding_domain%'

    App\Notifications\Application\Channel\NotificationChannelRegistry:
        arguments:
            $channels: !tagged_iterator app.notification_channel

    # Los binarios viven fuera del directorio público: se sirven solo a través
    # de un controlador que comprueba permisos (SECURITY.md §1).
    App\Documents\Domain\Service\DocumentStorageInterface: '@App\Documents\Infrastructure\Storage\LocalDocumentStorage'

    App\Documents\Infrastructure\Storage\LocalDocumentStorage:
        arguments:
            $directory: '%kernel.project_dir%/var/storage'

    # Los pesos del filtro determinista son configuración de producto
    # (config/packages/processing.yaml), no constantes del código.
    App\Processing\Application\Billing\BillingScoreWeights:
        factory: ['App\Processing\Application\Billing\BillingScoreWeights', 'fromArray']
        arguments:
            $config: '%app.processing.billing_score%'

    # El read model de servicios (Fase 12). Es un servicio explícito, y no un
    # alias, porque tiene su propia implementación: el repositorio de escritura
    # devuelve entidades y este devuelve vistas. Ver ARCHITECTURE.md §3.
    App\Services\Domain\Repository\ServiceViewRepositoryInterface: '@App\Services\Infrastructure\Repository\ServiceViewRepository'

    # Los pesos del matching de servicios son configuración de producto
    # (config/packages/processing.yaml), igual que los del filtro de facturación.
    App\Processing\Application\Matching\ServiceMatchWeights:
        factory: ['App\Processing\Application\Matching\ServiceMatchWeights', 'fromArray']
        arguments:
            $config: '%app.processing.matching%'

    # Los parámetros de la bandeja de descubrimientos (cuánto vive una
    # propuesta, cuánto se recuerda que el usuario la descartó) son política de
    # producto: config/packages/discovery.yaml.
    App\Discovery\Application\DiscoverySettings:
        factory: ['App\Discovery\Application\DiscoverySettings', 'fromArray']
        arguments:
            $config: '%app.discovery%'

    # Los parámetros del conocimiento aprendido del buzón (Fase 13) son
    # política de producto: config/packages/knowledge.yaml.
    App\Processing\Application\Knowledge\KnowledgeSettings:
        factory: ['App\Processing\Application\Knowledge\KnowledgeSettings', 'fromArray']
        arguments:
            $config: '%app.knowledge%'

    # El pipeline depende del puerto, no de la implementación: qué merece
    # analizarse es una política de producto y debe poder sustituirse sin tocar
    # el orquestador (D-31).
    App\Processing\Domain\Billing\BillingClassifierInterface: '@App\Processing\Application\Billing\BillingScoreCalculator'

    # El emparejamiento con el inventario también es política de producto: qué
    # señales pesan y qué puntuación asocia sola (ARCHITECTURE.md §13.10, D-35).
    App\Processing\Domain\Matching\ServiceMatcherInterface: '@App\Processing\Application\Matching\ServiceMatcher'

    # La detección de periodicidad es determinista por diseño (ARCHITECTURE.md §9):
    # el puerto existe para poder sustituirla, no porque la implementación vaya a
    # cambiar pronto.
    App\Discovery\Domain\Recurrence\RecurrenceDetectorInterface: '@App\Discovery\Application\Recurrence\IntervalRecurrenceDetector'

    # ── Nivel 3: lectura de documentos (ARCHITECTURE.md §13.6) ──────────────
    # El orden importa: se prueba el primero que reconozca el formato. El PDF va
    # antes que el texto plano porque un PDF también responde a `application/*`
    # y no queremos que un extractor genérico se lo quede.
    App\Processing\Application\Text\DocumentTextExtractorRegistry:
        arguments:
            $extractors: !tagged_iterator app.document_text_extractor

    App\Processing\Application\Text\ExtractDocumentText:
        arguments:
            $minCharacters: '%app.processing.ocr.min_characters%'
            $maxCharacters: '%app.processing.ocr.max_characters%'

    # El OCR es opcional por diseño: si Tesseract no está instalado, el motor
    # nulo hace que el pipeline degrade a IA o a revisión en lugar de fallar.
    App\Processing\Domain\Ocr\OcrEngineInterface: '@App\Processing\Infrastructure\Ocr\TesseractOcrEngine'

    App\Processing\Infrastructure\Ocr\TesseractOcrEngine:
        arguments:
            $binary: '%app.processing.ocr.binary%'
            $rasterizer: '%app.processing.ocr.rasterizer%'
            $languages: '%app.processing.ocr.languages%'
            $maxPages: '%app.processing.ocr.max_pages%'
            $dpi: '%app.processing.ocr.dpi%'
            $timeoutSeconds: '%app.processing.ocr.timeout_seconds%'

    # ── Nivel 4: conocimiento de proveedores (ARCHITECTURE.md §13.7) ────────
    App\Processing\Application\Provider\ProviderParserRegistry:
        arguments:
            $parsers: !tagged_iterator app.provider_parser

    App\Processing\Domain\Provider\ProviderResolverInterface: '@App\Processing\Application\Provider\ProviderResolver'

    # ── Fase 11: IA e integraciones (ARCHITECTURE.md §13.8, §13.9) ────────
    # El registro de proveedores de IA se construye con las clases etiquetadas.
    # Es la única lista de proveedores que existe: el panel de integraciones
    # la consulta, y el selector también, de modo que no pueden divergir.
    App\Ai\Infrastructure\Provider\AiProviderRegistry:
        arguments:
            $providers: !tagged_iterator app.ai_provider

    App\Ai\Domain\Contract\AiProviderRegistryInterface: '@App\Ai\Infrastructure\Provider\AiProviderRegistry'

    # El selector de proveedor es la política de «qué IA se usa para cada
    # necesidad». La implementación vive en `Ai\Application` porque decide
    # sobre datos del dominio (la elección de la organización).
    App\Ai\Domain\Contract\AiProviderSelectorInterface: '@App\Ai\Application\AiPurposeSelector'

    # La escalera de niveles: se recorren en orden, y cada extractor decide si
    # le toca. El orden importa, así que se declara explícitamente en vez de
    # confiar en el orden de discovery del contenedor.
    App\Ai\Application\Extraction\DocumentExtractorChain:
        arguments:
            $extractors:
                - '@App\Ai\Application\Extraction\AiDocumentExtractor'
                - '@App\Ai\Application\Extraction\AdvancedAiDocumentExtractor'

    App\Ai\Application\RedactContent:
        arguments:
            $maxLength: '%app.ai.max_text_length%'

    App\Ai\Application\Extraction\AdvancedAiDocumentExtractor:
        arguments:
            $confidenceThreshold: '%app.ai.advanced.confidence_threshold%'
            $maxTextLength: '%app.ai.advanced.max_text_length%'

    # El presupuesto se comprueba **antes** de cada llamada, así que su tope
    # es un parámetro de la aplicación y no una constante del código: es una
    # decisión comercial (lo que se está dispuesto a gastar por organización
    # y mes) y tiene que poder cambiar sin tocar PHP.
    App\Ai\Application\AiBudget:
        arguments:
            $monthlyMinor: '%app.ai.budget.monthly_minor%'

    # El pipeline depende de la puerta, no de la implementación: qué se manda
    # a un modelo y con qué presupuesto es política del módulo de IA, y el
    # pipeline no debe saber de eso (D-08).
    App\Ai\Application\AiExtractionInterface: '@App\Ai\Application\AiExtractionService'
