# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Los canales de notificación se recogen por etiqueta: añadir uno nuevo
    # (un webhook, por ejemplo) es escribir la clase y nada más.
    _instanceof:
        App\Notifications\Application\Channel\NotificationChannelInterface:
            tags: ['app.notification_channel']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # El cifrado de credenciales de buzón necesita el secreto de la aplicación.
    # Se inyecta explícitamente para que la clase no dependa de un parámetro
    # global y sea trivial de sustituir en un test.
    App\Mailbox\Infrastructure\Crypto\SodiumCredentialCipher:
        arguments:
            $appSecret: '%env(APP_SECRET)%'

    # El cliente IMAP se declara como alias explícito y no se deja al
    # autowiring: un alias implícito no es un servicio real, así que los tests
    # funcionales no podrían sustituirlo por un doble y acabarían abriendo
    # conexiones de verdad contra `imap.miempresa.com`.
    App\Mailbox\Application\Imap\ImapClientInterface: '@App\Mailbox\Infrastructure\Imap\WebklexImapClient'

    App\Notifications\Application\Channel\NotificationChannelRegistry:
        arguments:
            $channels: !tagged_iterator app.notification_channel

    # Los binarios viven fuera del directorio público: se sirven solo a través
    # de un controlador que comprueba permisos (SECURITY.md §1).
    App\Documents\Domain\Service\DocumentStorageInterface: '@App\Documents\Infrastructure\Storage\LocalDocumentStorage'

    App\Documents\Infrastructure\Storage\LocalDocumentStorage:
        arguments:
            $directory: '%kernel.project_dir%/var/storage'

    # Los pesos del filtro determinista son configuración de producto
    # (config/packages/processing.yaml), no constantes del código.
    App\Processing\Application\Billing\BillingScoreWeights:
        factory: ['App\Processing\Application\Billing\BillingScoreWeights', 'fromArray']
        arguments:
            $config: '%app.processing.billing_score%'
