version: 2

# Un PR por semana y ecosistema, no uno por dependencia: los parches y los cambios menores van
# agrupados y solo los saltos de versión mayor abren su propio PR, que es el único que hay que
# mirar a mano. El límite corta la avalancha cuando una actualización se atasca.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      composer-menores:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      docker-menores:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      actions-menores:
        patterns: ['*']
        update-types: ['minor', 'patch']
