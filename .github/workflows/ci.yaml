---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://localhost/health
      - name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      - name: Create test database
        run: docker compose exec -T php bin/console -e test doctrine:database:create --if-not-exists
      - name: Run migrations
        run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit
      - name: Run PHPStan
        run: docker compose exec -T php vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Check code style
        run: docker compose exec -T php vendor/bin/php-cs-fixer fix --dry-run --diff
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lo vendorizado a mano (Bootstrap, FontAwesome) y lo que genera
          # `importmap:install` es código de terceros: ni se formatea ni se
          # revisa aquí, y sin esta exclusión sus minificados llenan el
          # informe con miles de avisos. `assets/styles/backoffice.css` es el
          # artefacto compilado de `backoffice.scss` (Bootstrap dentro): se
          # revisa la fuente, no el resultado.
          FILTER_REGEX_EXCLUDE: '(^|/)assets/vendor/|(^|/)assets/styles/backoffice\.css$'
          # dotenv-linter no admite desactivar reglas por fichero y aquí las
          # comillas son obligatorias: Dotenv se come las dobles, así que
          # `API_CORS_ALLOWED_ORIGINS` y `APP_SECRET` van entre simples a
          # propósito (ver los comentarios de .env.dev y .env.test).
          DOTENV_LINTER_IGNORE_CHECKS: QuoteCharacter
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_PYTHON_BLACK: false
          # super-linter lanza `composer install` en cuanto detecta PHP y su
          # imagen no trae ext-fileinfo/ext-sodium/ext-xml, así que el job moría
          # antes de lintar nada. El PHP ya se valida en el job Tests (PHPUnit,
          # PHPStan y php-cs-fixer sobre la imagen real); aquí solo se lintan
          # el resto de lenguajes.
          VALIDATE_PHP_BUILTIN: false
          VALIDATE_PHP_PHPCS: false
          VALIDATE_PHP_PHPSTAN: false
          VALIDATE_PHP_PSALM: false
